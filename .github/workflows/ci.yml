name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  algo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: algo
      - run: composer qa

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fleet:fleet@127.0.0.1:5432/fleet
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: composer qa
      - run: composer db:init
      - run: composer test:integration
