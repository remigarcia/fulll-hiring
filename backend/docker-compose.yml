services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: fleet
            POSTGRES_USER: fleet
            POSTGRES_PASSWORD: fleet
        ports:
            - '5432:5432'
        volumes:
            - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U fleet']
            interval: 5s
            timeout: 5s
            retries: 10

    cli:
        build: .
        environment:
            DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet
        depends_on:
            postgres:
                condition: service_healthy
